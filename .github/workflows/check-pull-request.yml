name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

#      - name: SonarCloud Scan
#        if: github.actor != 'dependabot[bot]'
#        uses: SonarSource/sonarqube-scan-action@v5.3.1 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs the UAT pack's client-sync tests against the shared stack, with
  # dwt-client-sync built from this PR (see compose.integration.yml)
  # TODO: point at @main and drop uat-ref once DEFRA/digital-waste-tracking-uat#193 is merged
  integration-tests:
    name: Run Integration Tests
    needs: pr-validator
    uses: DEFRA/digital-waste-tracking-uat/.github/workflows/integration-tests.yml@shared-compose-and-integration-workflow
    with:
      compose-file: compose.integration.yml
      test-script: test:uat:client-sync
      uat-ref: shared-compose-and-integration-workflow

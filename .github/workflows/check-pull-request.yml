name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - minimal
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

#      - name: SonarCloud Scan
#        if: github.actor != 'dependabot[bot]'
#        uses: SonarSource/sonarqube-scan-action@v5.3.1 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs the UAT pack's client-sync tests against the full stack in
  # compose.integration.yml, with dwt-client-sync built from this PR. All the
  # credentials are made-up values for that throwaway stack, so no secrets are
  # needed; each password must match the ACCESS_CRED_* in compose.integration.yml.
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: pr-validator
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start Docker Compose Services
        id: start-docker-compose-services
        run: |
          docker compose -f compose.integration.yml up -d --build --wait
          docker compose -f compose.integration.yml ps

      - name: Checkout UAT Repository as Integration Test Suite
        uses: actions/checkout@v7
        with:
          repository: DEFRA/digital-waste-tracking-uat
          path: integration-tests

      - name: Setup Node.js for Integration Test Suite
        uses: actions/setup-node@v7
        with:
          node-version-file: integration-tests/.nvmrc
          cache: npm
          cache-dependency-path: integration-tests/package-lock.json

      - name: Install Integration Test Dependencies
        working-directory: integration-tests
        run: npm ci --ignore-scripts

      - name: Run Integration Tests
        id: integration-tests
        working-directory: integration-tests
        env:
          WASTE_MOVEMENT_EXTERNAL_API_BASE_URL: http://waste-tracking-external-api:3001
          WASTE_MOVEMENT_BACKEND_API_BASE_URL: http://waste-movement-backend:3001
          WASTE_ORGANISATION_BACKEND_API_BASE_URL: http://waste-organisation-backend:3001
          WASTE_MOVEMENT_CLIENT_SYNC_API_BASE_URL: http://dwt-client-sync:3001
          HTTP_PROXY: http://localhost:8080
          PROXY_MODE: zap
          ZAP_API_KEY: local-zap-key
          AUTH_DISABLED: false
          # The Floci user pool in compose.integration.yml; these are the seeded local test clients
          COGNITO_CLIENT_ID: '1234567890abcdef1234567890'
          COGNITO_CLIENT_NAME: 'Test Client 1'
          COGNITO_CLIENT_SECRET: local
          COGNITO_CLIENT_ID_2: '0987654321fedcba0987654321'
          COGNITO_CLIENT_NAME_2: 'Test Client 2'
          COGNITO_CLIENT_SECRET_2: local
          COGNITO_OAUTH_BASE_URL: http://floci:4566/cognito-idp
          ENVIRONMENT: dev
          API_LOGGING: true
          JIRA_BASE_URL: https://eaflood.atlassian.net/browse
          PROFILE: integration
          SERVICE_AUTH_PASSWORD: local-external-api
          SERVICE_AUTH_PASSWORD_WASTE_ORGANISATION_BACKEND: local-organisation-backend
          AUTH_PASSWORD_QA_NON_PROD: local-qa-non-prod
        run: |
          npm run test:uat:client-sync
          npm run test:zap-gate

      - name: Generate Test Report
        if: always()
        id: generate-report
        working-directory: integration-tests
        run: npm run report:generate

      - name: Upload Test Report
        if: always() && steps.generate-report.outcome == 'success'
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration-tests/allure-report/
          retention-days: 30

      - name: Comment Test Report Link on PR
        if: always() && steps.upload-report.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const statusEmoji = '${{ steps.integration-tests.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Integration Test Report ${statusEmoji}\n\nThe test report has been generated and is available as an artifact.\n\n📥 [Download Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-report.outputs.artifact-id }})`
            })

      - name: Stop Docker Compose Services
        if: always() && steps.start-docker-compose-services.outcome == 'success'
        run: docker compose -f compose.integration.yml down

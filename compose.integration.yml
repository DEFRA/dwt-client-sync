# Full stack for the integration tests (the UAT pack's test:uat:client-sync),
# with dwt-client-sync built from this repo and the other services from their
# published images. compose.yml stays the lightweight local setup.
#
# Every credential here is a made-up value for this throwaway stack only, so
# none of them are secrets. Each password must match the ACCESS_CRED_* that
# accepts it (base64 of '<service>=<password>').
services:
  waste-tracking-external-api:
    image: defradigital/waste-movement-external-api:${WASTE_TRACKING_EXTERNAL_API_VERSION:-latest}
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      # Trust tokens from the Floci user pool instead of the dev Cognito one
      JWT_COGNITO_USER_POOL_ID: eu-west-2_LOCAL
      JWT_JWKS_URI: http://floci:4566/eu-west-2_LOCAL/.well-known/jwks.json
      WASTE_TRACKING_SERVICE_URL: http://waste-tracking-id-backend:3001
      WASTE_MOVEMENT_SERVICE_URL: http://waste-movement-backend:3001
      WASTE_ORGANISATION_SERVICE_URL: http://waste-organisation-backend:3001
      DWT_CLIENT_SYNC_SERVICE_URL: http://dwt-client-sync:3001
      SERVICE_AUTH_PASSWORD: local-external-api
      # Local and CI only; each CDP environment sets its own list
      API_VERSIONS_ENABLED: ${API_VERSIONS_ENABLED:-beta-1,beta-2}
    networks:
      - cdp-tenant

  waste-movement-backend:
    image: defradigital/waste-movement-backend:${WASTE_MOVEMENT_BACKEND_VERSION:-latest}
    ports:
      - '3002:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGO_READ_PREFERENCE: primary
      ACCESS_CRED_WASTE_MOVEMENT_EXTERNAL_API: d2FzdGUtbW92ZW1lbnQtZXh0ZXJuYWwtYXBpPWxvY2FsLWV4dGVybmFsLWFwaQ==
      WASTE_TRACKING_SERVICE_URL: http://waste-tracking-id-backend:3001
      SERVICE_AUTH_PASSWORD_WASTE_MOVEMENT_BACKEND: local-movement-backend
      ACCESS_CRED_WASTE_ORGANISATION_BACKEND: d2FzdGUtb3JnYW5pc2F0aW9uLWJhY2tlbmQ9bG9jYWwtb3JnYW5pc2F0aW9uLWJhY2tlbmQ=
      ACCESS_CRED_QA_NON_PROD: cWEtbm9uLXByb2Q9bG9jYWwtcWEtbm9uLXByb2Q=
      ACCESS_CRED_PRODUCTION_APPROVAL_TESTS: cHJvZHVjdGlvbi1hcHByb3ZhbC10ZXN0cz1sb2NhbC1wcm9kdWN0aW9uLWFwcHJvdmFsLXRlc3Rz
      MAX_BULK_RECORDS: ${MAX_BULK_RECORDS:-100000}
      EXCLUDED_SUBMITTING_ORGANISATION_IDS: ${EXCLUDED_SUBMITTING_ORGANISATION_IDS:-}
    networks:
      - cdp-tenant

  waste-tracking-id-backend:
    image: defradigital/waste-tracking-id-backend:${WASTE_TRACKING_ID_BACKEND_VERSION:-latest}
    ports:
      - '3003:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      ACCESS_CRED_WASTE_MOVEMENT_EXTERNAL_API: d2FzdGUtbW92ZW1lbnQtZXh0ZXJuYWwtYXBpPWxvY2FsLWV4dGVybmFsLWFwaQ==
      ACCESS_CRED_WASTE_MOVEMENT_BACKEND: d2FzdGUtbW92ZW1lbnQtYmFja2VuZD1sb2NhbC1tb3ZlbWVudC1iYWNrZW5k
    networks:
      - cdp-tenant

  waste-organisation-backend:
    image: defradigital/waste-organisation-backend:${WASTE_ORGANISATION_BACKEND_VERSION:-latest}
    ports:
      - '3004:3001'
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      MONGO_READ_PREFERENCE: primary
      WASTE_CLIENT_AUTH_WASTE_MOVEMENT_EXTERNAL_API: local-external-api
      S3_ENDPOINT: http://localstack:4566
      SQS_ENDPOINT: http://localstack:4566
      AWS_S3_FORCE_PATH_STYLE: true
    networks:
      - cdp-tenant

  # Local Cognito user pool for the external API, created by
  # compose/floci/start.d/create-cognito-user-pool.sh. Point the UAT pack's
  # COGNITO_OAUTH_BASE_URL at http://localhost:3006/cognito-idp
  floci:
    image: floci/floci:2.1.0-compat
    ports:
      - '3006:4566'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      # Floci builds the token issuer from this, so tokens carry the
      # https://cognito-idp.eu-west-2.amazonaws.com/<pool> issuer the API checks
      FLOCI_BASE_URL: https://cognito-idp.eu-west-2.amazonaws.com
      # Keep the pool and its signing key across restarts: the API caches the JWKS
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      # Floci runs these scripts once it has started
      - ./compose/integration/floci/start.d:/etc/floci/init/start.d:ro,Z
      - floci-data:/app/data
    healthcheck:
      # The pool's JWKS only exists once the start hook has created it
      test:
        [
          'CMD',
          'curl',
          '-fs',
          'http://localhost:4566/eu-west-2_LOCAL/.well-known/jwks.json'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cdp-tenant

  mockserver:
    image: mockserver/mockserver:8.0.0
    ports:
      - 1080:1080
    environment:
      - MOCKSERVER_MAX_EXPECTATIONS=100
      - MOCKSERVER_MAX_HEADER_SIZE=8192
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/mockInitializer.json
    volumes:
      - ./compose/integration/mockInitializer.json:/config/mockInitializer.json
    networks:
      - cdp-tenant

  dwt-client-sync:
    build:
      context: .
      target: production
    ports:
      - '3005:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3001
      NODE_ENV: development
      ENVIRONMENT: local
      CDP_BASE_API_URL: mockserver:1080
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      ACCESS_CRED_WASTE_MOVEMENT_EXTERNAL_API: d2FzdGUtbW92ZW1lbnQtZXh0ZXJuYWwtYXBpPWxvY2FsLWV4dGVybmFsLWFwaQ==
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:6.0.13
    entrypoint: ['bash', '/compose/mongo_setup.sh']
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
      - ./compose/integration/mongo_setup.sh:/compose/mongo_setup.sh:Z
    restart: always
    healthcheck:
      test: mongosh --quiet --eval "try { var status = rs.status(); if (status.members[0].stateStr === 'PRIMARY') { quit(0); } else { quit(1); } } catch(e) { quit(1); }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack:Z'
      - ./compose/integration/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh:Z
    healthcheck:
      test: ['CMD', 'stat', '/tmp/READY']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - cdp-tenant

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >-
      zap.sh -daemon -silent -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=local-zap-key
    ports:
      - '8080:8080' # Proxy port - point your UAT test pack here
    networks:
      - cdp-tenant

volumes:
  mongodb-data:
  floci-data:

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
